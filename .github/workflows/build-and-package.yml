name: Build MCP Server

on:
  push:
    tags:
      - 'foundryvtt-mcp-v*.*.*'

permissions:
  contents: write

jobs:
  build-mcp-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
